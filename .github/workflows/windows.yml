name: Project validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: bevy_blob

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "bevy_blob -> target"

      - name: Show toolchain
        run: rustc --version --verbose

      - name: Compile all targets
        run: cargo check --locked --all-targets --target x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --locked --all-targets --target x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      # NUOVO STEP: Prepara il pacchetto finale inserendo .exe e assets nella stessa cartella
      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/x86_64-pc-windows-msvc/release/*.exe dist/
          if (Test-Path assets) {
            Copy-Item -Recurse assets dist/
          } else {
            Write-Host "Attenzione: cartella 'assets' non trovata nella root della workspace."
          }

      # MODIFICATO: Carica la cartella 'dist' contenente sia il gioco che le risorse grafico/audio
      - name: Upload Windows Executable & Assets
        uses: actions/upload-artifact@v4
        with:
          name: bevy_blob-windows-x64
          path: bevy_blob/dist/


