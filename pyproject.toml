[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creatura-semiliquida"
version = "0.1.0"
description = "Prototipo vettoriale 2D di una creatura semiliquida"
requires-python = ">=3.11"
dependencies = ["pygame>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
creatura-demo = "liquid_creature.demo:main"
creatura-cloud-demo = "liquid_creature.cloud_demo:main"
creatura-pbf-demo = "liquid_creature.pbf_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
